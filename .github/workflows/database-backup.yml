name: ShiftPilot Database Backup

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily -- off-peak, deliberately not on the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shiftpilot-database-backup
  cancel-in-progress: false

env:
  # The age *public* key. Encryption only needs this half of the keypair --
  # the private key that can actually decrypt these backups is held by a
  # human, never stored in this repo or in any CI secret, so a compromised
  # workflow run still can't read past or future backups.
  BACKUP_AGE_PUBLIC_KEY: age1rl9ktrlzu6kwtaum4pylpymdhxh6wzzjfa5upjh27zyttl7hae6q6ktqws

jobs:
  backup:
    name: Export and encrypt nightly backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Export and encrypt database
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/backup-database.mjs backups/shiftpilot-backup.json.age

      # Stored as a workflow artifact rather than committed to the repo:
      # committing to main would trigger ci.yml and a spurious Vercel
      # deployment on every nightly run for no reason, and a dedicated
      # backups branch would still trigger Vercel preview builds unless
      # separately configured to ignore it. Artifacts have no such side
      # effects. 90 days is GitHub's maximum retention for artifacts --
      # download and archive one periodically if longer-term retention is
      # needed later (see docs/RUNBOOK.md).
      - name: Upload encrypted backup as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftpilot-backup-${{ github.run_id }}
          path: backups/shiftpilot-backup.json.age
          retention-days: 90
