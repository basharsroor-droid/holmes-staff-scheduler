name: ShiftPilot Authenticated Production E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shiftpilot-authenticated-production-e2e
  cancel-in-progress: false

jobs:
  authenticated-e2e:
    name: Verify roles, departments and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run isolated authenticated fixtures against Production
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://forstsmvakpsreffdiwb.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PLAYWRIGHT_PRODUCTION_BASE_URL: https://www.shiftpilothq.com
        run: node scripts/run-production-authenticated-e2e.mjs
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-production-e2e-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
