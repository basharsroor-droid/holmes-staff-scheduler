name: ShiftPilot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shiftpilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate schema and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 reached end-of-life maintenance in April 2026. Node 22
          # is current LTS; it's also required for tests/unit (Node's
          # native TypeScript type-stripping, used to run
          # lib/israeli-holidays.ts's unit tests directly with no
          # transpile step, needs the --experimental-strip-types flag
          # available from 22.6 -- Node 20 doesn't have it at all).
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate tenant schema
        run: npm run validate:schema

      - name: Run unit tests
        run: npm run test:unit

      - name: Lint application
        run: npm run lint

      - name: Type-check application
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Install Playwright Chromium
        # --with-deps was dropped deliberately: it runs `apt-get update`
        # against Ubuntu's package mirrors before installing the browser,
        # and that step hung for the full 15-minute job timeout five times
        # in a row today (both here and on an earlier PR this session) --
        # confirmed from the raw log, it wasn't the Chromium download
        # itself that stalled, it was apt sitting on
        # archive.ubuntu.com/azure.archive.ubuntu.com InRelease fetches.
        # GitHub's ubuntu-latest runner image already ships the shared
        # libraries Chromium needs (it's a general-purpose desktop-ish
        # image, not a minimal container), so the OS package step this
        # flag adds is redundant here, not load-bearing -- if that
        # assumption ever turns out wrong, the browser launch itself in
        # the next step will fail with a clear missing-library error
        # instead of silently hanging.
        run: npx playwright install chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
