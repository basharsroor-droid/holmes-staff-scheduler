name: ShiftPilot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shiftpilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate schema and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 reached end-of-life maintenance in April 2026. Node 22
          # is current LTS; it's also required for tests/unit (Node's
          # native TypeScript type-stripping, used to run
          # lib/israeli-holidays.ts's unit tests directly with no
          # transpile step, needs the --experimental-strip-types flag
          # available from 22.6 -- Node 20 doesn't have it at all).
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate tenant schema
        run: npm run validate:schema

      - name: Run unit tests
        run: npm run test:unit

      - name: Build production application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
