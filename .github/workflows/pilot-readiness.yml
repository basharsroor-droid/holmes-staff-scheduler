name: ShiftPilot Pilot Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shiftpilot-pilot-readiness
  cancel-in-progress: true

jobs:
  readiness:
    name: Verify production pilot gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run pilot readiness gate
        run: npm run pilot:ready
